services:
  - type: web
    name: meu-site-django
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn projeto.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
